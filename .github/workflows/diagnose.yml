name: Build Safari Extension Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-project:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          set -e
          mkdir -p diagnostics

          /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/safari-web-extension-converter \
            --project-location "$RUNNER_TEMP/SFInspectorTest" \
            --app-name "SF Inspector Test" \
            --bundle-identifier "com.toprak.extensiontest" \
            --swift \
            --ios-only \
            --copy-resources \
            --no-open \
            --no-prompt \
            --force \
            . \
            > diagnostics/converter.txt 2>&1

          cat diagnostics/converter.txt

      - name: Fix Bundle Identifiers
        run: |
          set -e

          PROJECT=$(find "$RUNNER_TEMP/SFInspectorTest" -name '*.xcodeproj' -print -quit)
          PBXPROJ="$PROJECT/project.pbxproj"

          sed -i '' \
            -e 's/com\.toprak\.SF-Inspector-Test\.Extension/com.toprak.extensiontest.Extension/g' \
            -e 's/com\.toprak\.SF-Inspector-Test/com.toprak.extensiontest/g' \
            "$PBXPROJ"

          echo "=== Bundle IDs after correction ==="
          grep -n 'PRODUCT_BUNDLE_IDENTIFIER' "$PBXPROJ"

      - name: Install profiles and configure signing
        env:
          APP_PROFILE_BASE64: ${{ secrets.APP_STORE_PROFILE_BASE64 }}
          EXT_PROFILE_BASE64: ${{ secrets.EXTENSION_STORE_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          PROJECT=$(find "$RUNNER_TEMP/SFInspectorTest" -name '*.xcodeproj' -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found."
            exit 1
          fi

          PBXPROJ="$PROJECT/project.pbxproj"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          install_profile() {
            local name="$1"
            local content="$2"
            local file="$RUNNER_TEMP/$name.mobileprovision"
            local plist="$RUNNER_TEMP/$name.plist"

            if [ -z "$content" ]; then
              echo "ERROR: $name provisioning profile secret is empty."
              exit 1
            fi

            printf '%s' "$content" | base64 -D > "$file"
            security cms -D -i "$file" > "$plist"

            local uuid
            local profile_name
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$plist")
            profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$plist")

            cp "$file" "$PROFILE_DIR/$uuid.mobileprovision"

            echo "$name profile installed: $profile_name" >&2
            printf '%s' "$profile_name"
          }

          APP_PROFILE_PROFILE_NAME=$(install_profile APP_PROFILE "$APP_PROFILE_BASE64")
          EXT_PROFILE_PROFILE_NAME=$(install_profile EXT_PROFILE "$EXT_PROFILE_BASE64")

          echo "APP_PROFILE_PROFILE_NAME=$APP_PROFILE_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "EXT_PROFILE_PROFILE_NAME=$EXT_PROFILE_PROFILE_NAME" >> "$GITHUB_ENV"

          python3 - "$PBXPROJ" "$APPLE_TEAM_ID" "$APP_PROFILE_PROFILE_NAME" "$EXT_PROFILE_PROFILE_NAME" <<'PY'
          import re
          import sys

          path, team, app_profile, ext_profile = sys.argv[1:]

          with open(path, "r") as f:
              content = f.read()

          targets = {
              "SF Inspector Test": (
                  "com.toprak.extensiontest",
                  app_profile,
              ),
              "SF Inspector Test Extension": (
                  "com.toprak.extensiontest.Extension",
                  ext_profile,
              ),
          }

          def get_objects(text):
              objects = {}
              marker = re.search(r'(?m)^[ \t]*objects = \{\s*$', text)
              if not marker:
                  raise SystemExit("ERROR: PBX objects section not found.")

              start = marker.end()
              end = text.find("\n\t};", start)
              if end == -1:
                  raise SystemExit("ERROR: PBX objects section end not found.")

              section = text[start:end]
              pattern = re.compile(
                  r'(?ms)^[ \t]*([A-F0-9]{24}) /\*.*?\*/ = \{\n.*?^[ \t]*\};'
              )

              for match in pattern.finditer(section):
                  objects[match.group(1)] = match.group(0)

              return objects

          objects = get_objects(content)

          target_config_ids = {}

          for object_id, block in objects.items():
              if "isa = PBXNativeTarget;" not in block:
                  continue

              name_match = re.search(r'\bname = "([^"]+)";', block)
              if not name_match:
                  continue

              target_name = name_match.group(1)
              if target_name not in targets:
                  continue

              config_match = re.search(
                  r'(?s)buildConfigurationList = ([A-F0-9]{24})',
                  block,
              )
              if not config_match:
                  raise SystemExit(
                      f"ERROR: Build configuration list not found for {target_name}"
                  )

              target_config_ids[target_name] = config_match.group(1)

          if set(target_config_ids) != set(targets):
              missing = set(targets) - set(target_config_ids)
              raise SystemExit(
                  "ERROR: Targets not found: " + ", ".join(sorted(missing))
              )

          list_to_configs = {}

          for object_id, block in objects.items():
              if "isa = XCConfigurationList;" not in block:
                  continue

              match = re.search(r'(?s)buildConfigurations = \((.*?)\);', block)
              if match:
                  ids = re.findall(r'([A-F0-9]{24}) /\*', match.group(1))
                  list_to_configs[object_id] = ids

          configs_to_update = {}

          for target_name, list_id in target_config_ids.items():
              if list_id not in list_to_configs:
                  raise SystemExit(
                      f"ERROR: Configuration list missing for {target_name}"
                  )

              bundle_id, profile_name = targets[target_name]

              for config_id in list_to_configs[list_id]:
                  if config_id not in objects:
                      raise SystemExit(
                          f"ERROR: Build configuration {config_id} not found"
                      )

                  configs_to_update[config_id] = (
                      target_name, bundle_id, profile_name
                  )

          def set_setting(block, key, value):
              line = re.compile(
                  r'(?m)^([ \t]*)' + re.escape(key) + r' = .*?;[ \t]*$'
              )
              replacement = lambda m: m.group(1) + key + " = " + value + ";"

              if line.search(block):
                  return line.sub(replacement, block)

              marker = re.search(
                  r'(?m)^([ \t]*)PRODUCT_BUNDLE_IDENTIFIER = ',
                  block,
              )
              if not marker:
                  raise SystemExit(
                      "ERROR: PRODUCT_BUNDLE_IDENTIFIER missing in configuration"
                  )

              indent = marker.group(1)
              return (
                  block[:marker.start()]
                  + indent + key + " = " + value + ";\n"
                  + block[marker.start():]
              )

          for config_id, (target_name, bundle_id, profile_name) in configs_to_update.items():
              block = objects[config_id]

              settings_match = re.search(
                  r'(?ms)^([ \t]*buildSettings = \{\n)(.*?)(^[ \t]*\};)',
                  block,
              )

              if not settings_match:
                  raise SystemExit(
                      f"ERROR: buildSettings not found for {target_name} ({config_id})"
                  )

              prefix, settings, suffix = settings_match.groups()

              bundle_match = re.search(
                  r'(?m)^[ \t]*PRODUCT_BUNDLE_IDENTIFIER = "?([^";]+)"?;',
                  settings,
              )

              if not bundle_match:
                  raise SystemExit(
                      f"ERROR: Bundle ID missing for {target_name} ({config_id})"
                  )

              actual_bundle = bundle_match.group(1)

              if actual_bundle != bundle_id:
                  raise SystemExit(
                      f"ERROR: Unexpected bundle ID for {target_name}: {actual_bundle}"
                  )

              settings_values = {
                  "CODE_SIGN_STYLE": "Manual",
                  "CODE_SIGN_IDENTITY": '"Apple Distribution"',
                  "DEVELOPMENT_TEAM": team,
                  "PROVISIONING_PROFILE_SPECIFIER": '"' + profile_name + '"',
              }

              for key, value in settings_values.items():
                  settings = set_setting(settings, key, value)

              new_block = (
                  block[:settings_match.start()]
                  + prefix + settings + suffix
                  + block[settings_match.end():]
              )

              objects[config_id] = new_block
              content = content.replace(block, new_block, 1)

              print(
                  f"Configured {target_name}: {bundle_id}, "
                  f"profile={profile_name}"
              )

          with open(path, "w") as f:
              f.write(content)

          print("Signing configuration updated successfully.")
          PY

          echo "=== Verify signing configuration ==="
          grep -nE 'PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER' \
            "$PBXPROJ"

      - name: Find Xcode project and scheme
        run: |
          set -e

          PROJECT=$(find "$RUNNER_TEMP/SFInspectorTest" -name '*.xcodeproj' -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Xcode project not found" | tee diagnostics/build.txt
            exit 1
          fi

          echo "Project: $PROJECT" | tee diagnostics/build.txt

          xcodebuild -list -json -project "$PROJECT" \
            > diagnostics/project-list.json \
            2>> diagnostics/build.txt

          SCHEME=$(python3 -c \
            'import json; d=json.load(open("diagnostics/project-list.json")); print(d["project"]["schemes"][0])')

          echo "Scheme: $SCHEME" | tee -a diagnostics/build.txt

          echo "$PROJECT" > diagnostics/project-path.txt
          echo "$SCHEME" > diagnostics/scheme.txt

      - name: Inspect generated project targets
        run: |
          set -e

          PROJECT=$(cat diagnostics/project-path.txt)

          xcodebuild -list -project "$PROJECT" \
            | tee diagnostics/targets.txt

          echo "=== Project target definitions ==="

          grep -nE 'PBXNativeTarget|PRODUCT_BUNDLE_IDENTIFIER|appex|SafariWebExtension' \
            "$PROJECT/project.pbxproj" \
            | tee diagnostics/target-details.txt

      - name: Inspect signing targets
        run: |
          set -e

          PROJECT=$(cat diagnostics/project-path.txt)

          for TARGET in "SF Inspector Test" "SF Inspector Test Extension"; do
            echo "=== $TARGET ==="

            xcodebuild \
              -project "$PROJECT" \
              -target "$TARGET" \
              -showBuildSettings \
              2>/dev/null \
              | grep -E 'PRODUCT_BUNDLE_IDENTIFIER =|PRODUCT_NAME =|PRODUCT_TYPE =|CODE_SIGN_STYLE =|CODE_SIGN_IDENTITY =|PROVISIONING_PROFILE_SPECIFIER =|DEVELOPMENT_TEAM ='
          done

      - name: Build for iOS Simulator
        run: |
          PROJECT=$(cat diagnostics/project-path.txt)
          SCHEME=$(cat diagnostics/scheme.txt)

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > diagnostics/build-output.txt 2>&1

          RESULT=$?

          tail -n 100 diagnostics/build-output.txt

          echo "Build exit code: $RESULT" | tee diagnostics/build-result.txt

          exit "$RESULT"

      - name: Prepare signing credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PATH="$RUNNER_TEMP/apple_distribution.p12"

          if [ -z "$APPLE_CERTIFICATE_P12" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "ERROR: Apple Distribution certificate secret is empty."
            exit 1
          fi

          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$P12_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "Apple Distribution certificate imported."

      - name: Archive and export IPA
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -e

          PROJECT=$(cat diagnostics/project-path.txt)
          SCHEME=$(cat diagnostics/scheme.txt)
          ARCHIVE_PATH="$RUNNER_TEMP/SFInspectorTest.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"

          if [ -z "$APP_PROFILE_PROFILE_NAME" ] || [ -z "$EXT_PROFILE_PROFILE_NAME" ]; then
            echo "ERROR: Provisioning profile names are missing."
            exit 1
          fi

          mkdir -p "$EXPORT_PATH"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.toprak.extensiontest</key>
                  <string>${APP_PROFILE_PROFILE_NAME}</string>
                  <key>com.toprak.extensiontest.Extension</key>
                  <string>${EXT_PROFILE_PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

          echo "=== Archive ==="

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            archive

          echo "=== Export IPA ==="

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo "=== Exported IPA ==="
          ls -lh "$EXPORT_PATH"

      - name: Upload project and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-extension-build
          path: |
            diagnostics/
            ${{ runner.temp }}/SFInspectorTest/
            ${{ runner.temp }}/export/
          if-no-files-found: warn
