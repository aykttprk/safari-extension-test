name: Build Safari Extension Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-project:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          mkdir -p diagnostics
          /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/safari-web-extension-converter \
            . \
            --project-location "$RUNNER_TEMP/SFInspectorTest" \
            --app-name "SF Inspector Test" \
            --bundle-identifier "com.toprak.extensiontest" \
            --swift \
            --ios-only \
            --copy-resources \
            --no-open \
            --no-prompt \
            --force \
            > diagnostics/converter.txt 2>&1
          RESULT=$?
          cat diagnostics/converter.txt
          echo "Converter exit code: $RESULT"
          if [ "$RESULT" -eq 0 ]; then
            cd "$RUNNER_TEMP"
            zip -r "$GITHUB_WORKSPACE/diagnostics/SFInspectorTest-project.zip" SFInspectorTest
          fi
          exit "$RESULT"

      - name: Upload generated project and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-extension-project
          path: |
            diagnostics/
            ${{ runner.temp }}/SFInspectorTest/
          if-no-files-found: warn
