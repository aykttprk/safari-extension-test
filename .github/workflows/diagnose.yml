
name: Build Safari Extension Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-project:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          mkdir -p diagnostics
          /Applications/Xcode_16.4.app/Contents/Developer/usr/bin/safari-web-extension-converter \
            --project-location "$RUNNER_TEMP/SFInspectorTest" \
            --app-name "SF Inspector Test" \
            --bundle-identifier "com.toprak.extensiontest" \
            --swift \
            --ios-only \
            --copy-resources \
            --no-open \
            --no-prompt \
            --force \
            . \
            > diagnostics/converter.txt 2>&1
          RESULT=$?
          cat diagnostics/converter.txt
          exit "$RESULT"

      - name: Fix Bundle Identifiers
        run: |
          PROJECT=$(find "$RUNNER_TEMP/SFInspectorTest" -name '*.xcodeproj' -print -quit)
          PBXPROJ="$PROJECT/project.pbxproj"

          sed -i '' \
            -e 's/com\.toprak\.SF-Inspector-Test\.Extension/com.toprak.extensiontest.Extension/g' \
            -e 's/com\.toprak\.SF-Inspector-Test/com.toprak.extensiontest/g' \
            "$PBXPROJ"

          echo "=== Bundle IDs after correction ==="
          grep -n 'PRODUCT_BUNDLE_IDENTIFIER' "$PBXPROJ"

      - name: Inspect project signing configuration
        run: |
          PROJECT=$(find "$RUNNER_TEMP/SFInspectorTest" -name '*.xcodeproj' -print -quit)
          PBXPROJ="$PROJECT/project.pbxproj"

          echo "=== Signing configuration ==="
          grep -nE 'CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|ProvisioningStyle|PROVISIONING_PROFILE' \
            "$PBXPROJ" || true

      - name: Find Xcode project and scheme
        run: |
          PROJECT=$(find "$RUNNER_TEMP/SFInspectorTest" -name '*.xcodeproj' -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Xcode project not found" | tee diagnostics/build.txt
            exit 1
          fi

          echo "Project: $PROJECT" | tee diagnostics/build.txt
          xcodebuild -list -json -project "$PROJECT" \
            > diagnostics/project-list.json 2>> diagnostics/build.txt

          SCHEME=$(python3 -c \
            'import json; d=json.load(open("diagnostics/project-list.json")); print(d["project"]["schemes"][0])')

          echo "Scheme: $SCHEME" | tee -a diagnostics/build.txt
          echo "$PROJECT" > diagnostics/project-path.txt
          echo "$SCHEME" > diagnostics/scheme.txt

      - name: Inspect generated project targets
        run: |
          PROJECT=$(cat diagnostics/project-path.txt)

          xcodebuild -list -project "$PROJECT" \
            | tee diagnostics/targets.txt

          echo "=== Project target definitions ==="
          grep -nE 'PBXNativeTarget|PRODUCT_BUNDLE_IDENTIFIER|appex|SafariWebExtension' \
            "$PROJECT/project.pbxproj" \
            | tee diagnostics/target-details.txt

      - name: Inspect signing targets
        run: |
          PROJECT=$(cat diagnostics/project-path.txt)

          for TARGET in "SF Inspector Test" "SF Inspector Test Extension"; do
            echo "=== $TARGET ==="
            xcodebuild \
              -project "$PROJECT" \
              -target "$TARGET" \
              -showBuildSettings \
              2>/dev/null \
              | grep -E 'PRODUCT_BUNDLE_IDENTIFIER =|PRODUCT_NAME =|PRODUCT_TYPE =|CODE_SIGN_STYLE ='
          done

      - name: Build for iOS Simulator
        run: |
          PROJECT=$(cat diagnostics/project-path.txt)
          SCHEME=$(cat diagnostics/scheme.txt)

          set +e
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > diagnostics/build-output.txt 2>&1
          RESULT=$?

          tail -n 100 diagnostics/build-output.txt
          echo "Build exit code: $RESULT" | tee diagnostics/build-result.txt
          exit "$RESULT"

      - name: Prepare signing credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          set -e

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PATH="$RUNNER_TEMP/apple_distribution.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8"

          echo "$APPLE_CERTIFICATE_P12" | base64 -D > "$P12_PATH"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive and export IPA
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          set -e

          PROJECT=$(cat diagnostics/project-path.txt)
          SCHEME=$(cat diagnostics/scheme.txt)
          ARCHIVE_PATH="$RUNNER_TEMP/SFInspectorTest.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT_PATH"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

          echo "=== Exported IPA ==="
          ls -lh "$EXPORT_PATH"

      - name: Upload project and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-extension-build
          path: |
            diagnostics/
            ${{ runner.temp }}/SFInspectorTest/
            ${{ runner.temp }}/export/
          if-no-files-found: warn
